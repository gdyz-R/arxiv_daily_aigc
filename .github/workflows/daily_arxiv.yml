name: Daily AI Research Gazette

on:
  schedule:
    # Runs 'at 04:00 UTC' every day
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional report date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: daily-arxiv-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Needed to push changes back to the repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run offline tests
      run: |
        python -m compileall src
        python -m unittest discover -s tests -v

    - name: Verify required GitHub Secrets
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DASUAPI_API_KEY: ${{ secrets.DASUAPI_API_KEY }}
      run: |
        test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY secret"; exit 1; }
        test -n "$DASUAPI_API_KEY" || { echo "Missing DASUAPI_API_KEY secret"; exit 1; }

    - name: Run multi-source paper newspaper pipeline
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DASUAPI_API_KEY: ${{ secrets.DASUAPI_API_KEY }}
        SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        REPORT_DATE: ${{ inputs.report_date }}
      run: |
        if [ -n "$REPORT_DATE" ]; then
          python src/main.py --date "$REPORT_DATE" --force
        else
          python src/main.py
        fi

    - name: Check public outputs for secrets and local paths
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        DASUAPI_API_KEY: ${{ secrets.DASUAPI_API_KEY }}
        SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      run: python src/privacy.py daily_json daily_html reports.json assets/report.css assets/figures

    - name: Commit and push changes
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -- daily_json/ daily_html/ assets/report.css reports.json
        find assets/figures -type f -name '*.png' -print0 | xargs -0 -r git add --
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update Daily AI Research Gazette $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
        fi
