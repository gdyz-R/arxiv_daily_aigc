name: Daily AI Research Gazette

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: Optional report date (YYYY-MM-DD)
        required: false
        type: string

concurrency:
  group: daily-arxiv-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Needed to push changes back to the repository

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Run offline tests
      run: |
        python -m compileall src
        python -m unittest discover -s tests -v

    - name: Verify required model Secrets and Variables
      env:
        COARSE_LLM_API_KEY: ${{ secrets.COARSE_LLM_API_KEY }}
        EDITORIAL_LLM_API_KEY: ${{ secrets.EDITORIAL_LLM_API_KEY }}
        COARSE_LLM_BASE_URL: ${{ vars.COARSE_LLM_BASE_URL }}
        COARSE_LLM_MODEL: ${{ vars.COARSE_LLM_MODEL }}
        EDITORIAL_LLM_BASE_URL: ${{ vars.EDITORIAL_LLM_BASE_URL }}
        EDITORIAL_LLM_MODEL: ${{ vars.EDITORIAL_LLM_MODEL }}
      run: |
        test -n "$COARSE_LLM_API_KEY" || { echo "Missing COARSE_LLM_API_KEY Repository Secret"; exit 1; }
        test -n "$EDITORIAL_LLM_API_KEY" || { echo "Missing EDITORIAL_LLM_API_KEY Repository Secret"; exit 1; }
        test -n "$COARSE_LLM_BASE_URL" || { echo "Missing COARSE_LLM_BASE_URL Repository Variable"; exit 1; }
        test -n "$COARSE_LLM_MODEL" || { echo "Missing COARSE_LLM_MODEL Repository Variable"; exit 1; }
        test -n "$EDITORIAL_LLM_BASE_URL" || { echo "Missing EDITORIAL_LLM_BASE_URL Repository Variable"; exit 1; }
        test -n "$EDITORIAL_LLM_MODEL" || { echo "Missing EDITORIAL_LLM_MODEL Repository Variable"; exit 1; }

    - name: Run multi-source paper newspaper pipeline
      env:
        COARSE_LLM_API_KEY: ${{ secrets.COARSE_LLM_API_KEY }}
        EDITORIAL_LLM_API_KEY: ${{ secrets.EDITORIAL_LLM_API_KEY }}
        COARSE_LLM_BASE_URL: ${{ vars.COARSE_LLM_BASE_URL }}
        COARSE_LLM_MODEL: ${{ vars.COARSE_LLM_MODEL }}
        COARSE_LLM_TOKEN_FIELD: ${{ vars.COARSE_LLM_TOKEN_FIELD }}
        COARSE_LLM_REASONING_FORMAT: ${{ vars.COARSE_LLM_REASONING_FORMAT }}
        COARSE_LLM_REASONING_EFFORT: ${{ vars.COARSE_LLM_REASONING_EFFORT }}
        EDITORIAL_LLM_BASE_URL: ${{ vars.EDITORIAL_LLM_BASE_URL }}
        EDITORIAL_LLM_MODEL: ${{ vars.EDITORIAL_LLM_MODEL }}
        EDITORIAL_LLM_TOKEN_FIELD: ${{ vars.EDITORIAL_LLM_TOKEN_FIELD }}
        EDITORIAL_LLM_REASONING_FORMAT: ${{ vars.EDITORIAL_LLM_REASONING_FORMAT }}
        EDITORIAL_LLM_REASONING_EFFORT: ${{ vars.EDITORIAL_LLM_REASONING_EFFORT }}
        SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
        REPORT_DATE: ${{ inputs.report_date }}
      run: |
        if [ -n "$REPORT_DATE" ]; then
          python src/main.py --date "$REPORT_DATE" --force
        else
          python src/main.py --force
        fi

    - name: Check public outputs for secrets and local paths
      env:
        COARSE_LLM_API_KEY: ${{ secrets.COARSE_LLM_API_KEY }}
        EDITORIAL_LLM_API_KEY: ${{ secrets.EDITORIAL_LLM_API_KEY }}
        SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      run: python src/privacy.py daily_json daily_html reports.json assets/report.css assets/figures

    - name: Commit and push changes
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add -- daily_json/ daily_html/ assets/report.css reports.json
        find assets/figures -type f -name '*.png' -print0 | xargs -0 -r git add --
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Update Daily AI Research Gazette $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin HEAD:main
        fi
