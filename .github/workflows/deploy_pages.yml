name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - Daily AI Research Gazette
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site only
        run: |
          mkdir -p _site/assets
          cp index.html list.html reports.json _site/
          cp -R daily_html daily_json _site/
          cp assets/report.css _site/assets/
          mkdir -p _site/assets/figures
          find assets/figures -type f -name '*.png' -print0 | while IFS= read -r -d '' image; do
            mkdir -p "_site/$(dirname "$image")"
            cp "$image" "_site/$image"
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
