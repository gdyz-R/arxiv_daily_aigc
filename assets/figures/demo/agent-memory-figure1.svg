<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Agent memory architecture demo</title>
  <desc id="desc">A schematic showing observations flowing into structured memory, retrieval, planning, and tool execution.</desc>
  <rect width="1200" height="750" fill="#fffaf4"/>
  <g font-family="Arial, sans-serif" fill="#262220">
    <text x="60" y="72" font-size="34" font-weight="700">Structured Long-Horizon Agent Memory</text>
    <text x="60" y="108" font-size="18" fill="#6f625a">Local preview asset — representative system flow</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#990f3d"/>
    </marker>
  </defs>
  <g stroke="#262220" stroke-width="3" fill="#fff1e5">
    <rect x="70" y="250" width="190" height="150" rx="10"/>
    <rect x="350" y="185" width="260" height="280" rx="10" fill="#f7dfd1"/>
    <rect x="705" y="205" width="200" height="120" rx="10"/>
    <rect x="705" y="370" width="200" height="120" rx="10"/>
    <rect x="990" y="285" width="150" height="150" rx="10"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#262220">
    <text x="165" y="315" font-size="23" font-weight="700">Observation</text>
    <text x="165" y="350" font-size="18">tool results</text>
    <text x="165" y="377" font-size="18">environment state</text>
    <text x="480" y="230" font-size="24" font-weight="700">Structured Memory</text>
    <text x="480" y="285" font-size="19">Task layer</text>
    <text x="480" y="335" font-size="19">State layer</text>
    <text x="480" y="385" font-size="19">Evidence layer</text>
    <text x="805" y="258" font-size="23" font-weight="700">Retriever</text>
    <text x="805" y="292" font-size="17">minimal relevant context</text>
    <text x="805" y="422" font-size="23" font-weight="700">Planner</text>
    <text x="805" y="456" font-size="17">next action</text>
    <text x="1065" y="342" font-size="23" font-weight="700">Tool</text>
    <text x="1065" y="375" font-size="17">execution</text>
  </g>
  <g fill="none" stroke="#990f3d" stroke-width="5" marker-end="url(#arrow)">
    <path d="M260 325 H340"/>
    <path d="M610 270 H695"/>
    <path d="M805 325 V360"/>
    <path d="M905 430 H980"/>
    <path d="M1065 435 C1065 610 480 620 480 478"/>
  </g>
</svg>