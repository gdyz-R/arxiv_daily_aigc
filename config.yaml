project:
  newspaper_name: "Daily AI Research Gazette"
  # Used in archive filenames. Keep this short and filesystem-safe.
  archive_title: "AI研究日报"
  subtitle: "LLM Systems, Efficient Sequence Models, Agents & Theory"
  language: "zh-CN"
  timezone: "Asia/Shanghai"
  edition_size: 7
  focus_count: 6
  cross_topic_count: 1
  max_major_features: 2

topic_rotation:
  monday: engineering_deployment
  tuesday: subquadratic_attention
  wednesday: cot_agentic_ai
  thursday: theory_loss_landscape
  friday: engineering_deployment
  saturday: subquadratic_attention
  sunday: cot_agentic_ai

