      - "LLM serving"
      - "vLLM"
      - "TensorRT-LLM"
      - "continuous batching"
      - "mixture of experts serving"
      - "model compression"
    contribution_tags:
      - "KV Cache"
      - "FlashAttention"
      - "Quantization"
      - "Speculative Decoding"
      - "Serving"
      - "Inference Acceleration"

  subquadratic_attention:
