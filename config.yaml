  contribution_tag_allowlist:
    - KV Cache
    - FlashAttention
    - Quantization
    - Speculative Decoding
    - Serving
    - Inference Acceleration
    - Mamba
    - SSM
    - Linear Attention
    - RWKV
    - Recurrent
    - Long Context
    - Chain-of-Thought
    - Reasoning
    - Tool Use
    - Multi-Agent
    - Planning
    - Agent Memory
    - Mechanistic Interpretability
    - Loss Landscape
    - Optimization Dynamics
    - Expressivity
    - Representation Geometry
    - Scaling Laws

sources:
  user_agent: "Daily-AI-Research-Gazette/2.0 (personal research digest)"
  arxiv:
    enabled: true
    lookback_days: 3
    max_results_per_topic: 45
    delay_seconds: 3
    num_retries: 4
    timeout_seconds: 30
    # Shared CI addresses are sometimes rate-limited by the query API.
    # Category RSS is filtered locally with the same category+keyword intent.
    rss_enabled: true
    rss_base_url: "https://rss.arxiv.org/rss"
    rss_announce_types: ["new", "cross"]
  semantic_scholar:
    enabled: true
    base_url: "https://api.semanticscholar.org/graph/v1"
    api_key_env: "SEMANTIC_SCHOLAR_API_KEY"
    timeout_seconds: 20
    requests_per_second: 0.8
    max_retries: 3
  arxiv_html:
    enabled: true
    base_url: "https://arxiv.org/html"
    timeout_seconds: 20
    requests_per_second: 0.5
    validate_images: true
    cache_images: true
    cache_dir: "assets/figures"
    max_image_bytes: 10000000
    max_image_pixels: 40000000
    allowed_formats: ["PNG", "JPEG", "WEBP"]
  neurips:
    enabled: true
    proceedings_base_url: "https://papers.nips.cc"
    virtual_base_url: "https://neurips.cc/virtual"
    candidate_window_days: 45
    max_detail_pages: 80
    timeout_seconds: 25
  # General top-conference source. Edit selection.top_venues/venue_aliases to change coverage.
  openalex:
    enabled: true
    base_url: "https://api.openalex.org"
    mailto_env: "OPENALEX_MAILTO"
    lookback_days: 3
    max_results_per_topic: 25
    timeout_seconds: 25
    requests_per_second: 1.0
    max_retries: 3

llm:
  coarse:
    provider: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    model: "deepseek-v4-flash"
    reasoning_effort: "low"
    token_field: "max_tokens"
    timeout_seconds: 90
    max_retries: 3
    temperature: 0.1
  editorial:
    provider: "dasuapi"
    base_url: "https://dasuapi.com/v1"
    api_key_env: "DASUAPI_API_KEY"
    model: "gpt-5.6-terra"
    reasoning_effort: "max"
    token_field: "max_completion_tokens"
    timeout_seconds: 180
    max_retries: 3
    temperature: 0.25

render:
  template: "index.html"
  stylesheet: "styles.css"
  public_stylesheet: "assets/report.css"
  output_dir: "daily_html"
  json_dir: "daily_json"
  title_max_length: 48
  image_aspect_ratio: "16 / 10"
