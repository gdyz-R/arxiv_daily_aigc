project:
  newspaper_name: "Daily AI Research Gazette"
  # Used in archive filenames. Keep this short and filesystem-safe.
  archive_title: "AI研究日报"
  subtitle: "LLM Systems, Efficient Sequence Models, Agents & Theory"
  language: "zh-CN"
  timezone: "Asia/Shanghai"
  edition_size: 7
  focus_count: 6
  cross_topic_count: 1
  max_major_features: 2

topic_rotation:
  monday: engineering_deployment
  tuesday: subquadratic_attention
  wednesday: cot_agentic_ai
  thursday: theory_loss_landscape
  friday: engineering_deployment
  saturday: subquadratic_attention
  sunday: cot_agentic_ai

# Legacy weekday rotation remains for old archives and external callers. New daily
# runs use the volume-independent cooldown scheduler below.
scheduler:
  topic_pool:
    - engineering_deployment
    - kv_cache_memory
    - subquadratic_attention
    - ssm_mamba
    - cot_agentic_ai
    - process_reward_models
    - world_models
    - causal_inference
    - interpretability
    - theory_loss_landscape
  cooldown_days: 7
  starvation_days: 21
  unseen_topic_days: 365
  angle_cooldown_days: 4
  angle_starvation_days: 12
  unseen_angle_days: 365
  angle_pool:
    - paradigm_evolution
    - engineering_edge_cases
    - first_principles
    - failure_counterexamples
    - evaluation_methodology
    - systems_tradeoffs
  angles:
    paradigm_evolution:
      name: "范式冲突与技术演进"
      name_en: "Paradigm Conflict & Evolution"
      instruction: "比较新方案与主流范式的核心假设、替代关系和演进路径，指出真正改变范式之处。"
    engineering_edge_cases:
      name: "工程落地与 Edge Case"
      name_en: "Engineering & Edge Cases"
      instruction: "从部署约束、极端输入、故障恢复和维护成本切入，区分论文演示与真实系统可用性。"
    first_principles:
      name: "底层理论与第一性原理"
      name_en: "Theory & First Principles"
      instruction: "从目标函数、归纳偏置、复杂度或信息流推导方法为何有效，以及依赖哪些不可省略的假设。"
    failure_counterexamples:
      name: "反例、失效模式与适用边界"
      name_en: "Failures & Counterexamples"
      instruction: "优先寻找反例、分布外失效、脆弱假设与负结果，明确论文结论不能外推到哪些场景。"
    evaluation_methodology:
      name: "评测可信度与实验方法学"
      name_en: "Evaluation Methodology"
      instruction: "检查基线、公平预算、数据污染、消融和统计证据，判断改进是否真的由所宣称机制带来。"
    systems_tradeoffs:
      name: "系统权衡与成本结构"
      name_en: "System Trade-offs & Cost Structure"
      instruction: "比较时延、吞吐、显存、训练成本、可扩展性和质量之间的交换关系，识别隐藏成本。"

