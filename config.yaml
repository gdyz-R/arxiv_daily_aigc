  high_citation_threshold: 100
  recent_high_citation_threshold: 20
  recent_days: 120
  candidate_limit_per_topic: 45
  top_venues:
    - NeurIPS
    - NIPS
    - ICLR
    - ICML
    - ACL
    - EMNLP
    - NAACL
    - COLM
    - JMLR
    - TMLR
    - CVPR
    - ICCV
    - ECCV
    - AAAI
    - IJCAI
    - KDD
    - WWW
    - SIGIR
    - AISTATS
    - UAI
    - CoRL
    - RSS
  # Venue matching is config-driven. Add a tag here and to top_venues to extend coverage.
  venue_aliases:
