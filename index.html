<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily AI Research Gazette</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            /* Use percentage height */
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
        }

        #content-wrapper {
            flex: 1 1 auto;
            /* Grow, shrink, basis auto */
            overflow: hidden;
            /* Contain the iframe */
            position: relative;
            /* Needed for absolute positioning of iframe if required */
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            /* Make iframe fill its container */
            display: block;
            /* Ensure iframe is treated as a block element */
        }

        #loading-message,
        #error-message {
            padding: 20px;
            text-align: center;
            margin-top: 50px;
        }

        #error-message p {
            color: red;
        }
    </style>
    <script>
        async function loadLatestReportIntoIframe() {
            const iframe = document.getElementById('report-frame');
            const loadingMessage = document.getElementById('loading-message');
            const errorMessageDiv = document.getElementById('error-message');

            try {
                const response = await fetch('reports.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const reports = await response.json();

                if (reports && reports.length > 0) {
                    const latestReportFile = reports[0];
                    const latestReportUrl = `./daily_html/${latestReportFile}`;

                    iframe.onload = () => {
                        loadingMessage.style.display = 'none';
                        iframe.style.display = 'block';
                    };
                    iframe.src = latestReportUrl;
                    const latestReportName = latestReportFile.split('/').pop();
                    document.title = `Daily AI Research Gazette - ${latestReportName.replace('.html', '').replace(/_/g, '-')}`;

                } else {
                    throw new Error('无法找到最新的报告文件。请确保 reports.json 文件存在且包含报告列表。');
                }
            } catch (error) {
                console.error('Error loading report:', error);
                loadingMessage.style.display = 'none'; // Hide loading message
                errorMessageDiv.innerHTML = `<p style="color: red; text-align: center; margin-top: 50px;">加载最新报告时出错: ${error.message} 请 <a href="./list.html">查看报告列表</a>。</p>`;
                errorMessageDiv.style.display = 'block'; // Show error message
            }
        }

        // Execute the loading function when the page loads
        window.onload = loadLatestReportIntoIframe;
    </script>
</head>

<body>
    <div id="content-wrapper">
        <div id="loading-message">
            <p>正在加载最新报告，请稍候...</p>
        </div>
        <div id="error-message" style="display: none;">
            <!-- Error messages will be displayed here -->
        </div>
        <iframe id="report-frame" title="最新一期 AI 研究日报" style="display: none;"></iframe>
    </div>
</body>

</html>
